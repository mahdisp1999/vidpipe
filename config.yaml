# FFmpeg video output settings. The selected container is controlled by --format
# or inferred from the generated output extension (MKV by default).
codec: libx264 # av1_nvenc, libx264, libx264rgb, h264_nvenc, libx265
crf: 18
preset: fast
pixel_format: yuv420p
audio_codec: copy

# Maximum number of decoded/processed frames held in each RAM queue.
queue_depth: 4

device: gpu # auto | gpu | cpu

memory:
  mode: auto # auto | manual
  safety_margin_ram: 0.15
  max_ram_gb: 0.0 # manual mode only
  max_vram_gb: 0.0 # manual mode only; 0 means no PyTorch allocator limit
  prefetch_depth: 2 # manual queue depth
  prefetch_depth_max: 8 # maximum queue depth in auto mode
  tile_size: 0 # 0 = use each model stage's tile_size
  batch_size: 2 # initial number of tiles sent to the model together
  batch_size_max: 4 # hard cap for model-stage batch settings

# Stages run in order. A model's scale is detected from its architecture.
stages:
  - name: model
    # model: ./models/1xDeJPG_OmniSR.pth
    # model: ./models/realesr-general-wdn-x4v3.pth
    model: ./models/realesr-general-x4v3.pth
    tile_size: 256
    tile_pad: 16
    half: True # true enables FP16 on supported CUDA models

# Example second stage:
#  - name: model
#    model: ./models/realesr-general-x4v3.pth
#    tile_size: 192
#    tile_pad: 16
#    half: true
